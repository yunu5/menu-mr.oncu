<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-900 pb-20">
    <div class="max-w-lg mx-auto p-6">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-serif font-bold">Restaurant Name</h1>
            <p class="text-stone-600 mt-2 italic">Authentic Local Flavors</p>
        </header>

        <section>
            <!-- Repeat this block 10-15 times -->
            <div class="flex justify-between items-center border-b border-stone-200 py-4">
                <div>
                    <h3 class="font-bold text-lg">Dish Name</h3>
                    <p class="text-sm text-stone-600">Brief ingredients description here.</p>
                </div>
                <span class="font-bold text-lg">Price</span>
            </div>
            <!-- End block -->
        </section>
    </div>

    <footer class="fixed bottom-0 w-full p-4 bg-white border-t border-stone-200 shadow-lg text-center">
        <a href="https://wa.me/YOUR_WHATSAPP_NUMBER" class="block w-full max-w-lg mx-auto bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition">
            Order via WhatsApp
        </a>
    </footer>
</body>
</html>
