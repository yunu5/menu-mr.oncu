<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FAF9F6;
      --border: #E8E5DF;
      --text-muted: #9E9B95;
      --accent: #2C2C2A;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: #1A1916;
      -webkit-font-smoothing: antialiased;
    }

    .serif { font-family: 'DM Serif Display', serif; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up   { animation: fadeUp 0.55s ease both; }
    .fade-up-2 { animation: fadeUp 0.55s 0.12s ease both; }
    .fade-up-3 { animation: fadeUp 0.55s 0.26s ease both; }

    .category-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-muted);
    }

    .menu-card { transition: background 0.2s ease, box-shadow 0.2s ease; }
    .menu-card:hover {
      background: white;
      box-shadow: 0 2px 20px rgba(0,0,0,0.06);
    }

    /* Food image */
    .food-img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 12px;
      flex-shrink: 0;
      background: #EDEAE3;
    }
    .food-img-placeholder {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      flex-shrink: 0;
      background: #EDEAE3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge {
      display: inline-block;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .badge-new     { background:#F0EDE6; color:#8B7355; }
    .badge-popular { background:#EBF3EC; color:#4A7C59; }
    .badge-spicy   { background:#FDECEA; color:#C0392B; }
    .badge-veg     { background:#EBF3EC; color:#3A6B47; }

    .wa-btn {
      background: var(--accent);
      color: #fff;
      border-radius: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    }
    .wa-btn:hover {
      background: #3D3D3A;
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(0,0,0,0.22);
    }
    .wa-btn:active { transform: translateY(0); }

    .sticky-footer {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(250,249,246,0.88);
      border-top: 1px solid var(--border);
    }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #EDEAE3 25%, #E3E0D8 50%, #EDEAE3 75%);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 10px;
    }

    /* Error state */
    #error-msg { display: none; }
  </style>
</head>
<body class="min-h-screen pb-28">

  <!-- HEADER (static — controlled by restaurant.name in menu.json) -->
  <header id="site-header" class="pt-12 pb-8 px-6 text-center fade-up">
    <div class="flex justify-center mb-5">
      <div class="w-10 h-10 rounded-full border border-stone-300 flex items-center justify-center">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1C4.13 1 1 4.13 1 8s3.13 7 7 7 7-3.13 7-7-3.13-7-7-7zm0 2.5A1.5 1.5 0 1 1 8 7a1.5 1.5 0 0 1 0-3zm0 8.75a5.25 5.25 0 0 1-4.375-2.344C3.645 9.113 6.218 8.5 8 8.5c1.78 0 4.354.613 4.375 1.406A5.25 5.25 0 0 1 8 12.25z" fill="#9E9B95"/>
        </svg>
      </div>
    </div>
    <h1 id="restaurant-name" class="serif text-4xl text-stone-800 leading-tight">…</h1>
    <p id="restaurant-subtitle" class="mt-2 text-sm text-stone-400 font-light tracking-wide"></p>
    <div class="mt-5 flex items-center justify-center gap-4 text-xs text-stone-400">
      <span id="restaurant-hours"></span>
      <span class="w-1 h-1 rounded-full bg-stone-300 inline-block"></span>
      <span id="restaurant-timing"></span>
    </div>
  </header>

  <!-- ERROR STATE -->
  <div id="error-msg" class="max-w-md mx-auto px-6 py-10 text-center text-stone-400 text-sm">
    <p>⚠️ Could not load menu data.<br/>Make sure <code>menu.json</code> is in the same folder.</p>
  </div>

  <!-- MENU CONTENT (rendered by JS) -->
  <main id="menu-root" class="max-w-md mx-auto px-4 fade-up-2"></main>

  <!-- FOOTER NOTE -->
  <p class="text-center text-xs text-stone-400 font-light px-4 pb-4 leading-relaxed max-w-md mx-auto">
    Please inform your server of any allergies or dietary requirements.<br/>
    All prices include VAT. Menu items may vary seasonally.
  </p>

  <!-- STICKY WHATSAPP BUTTON -->
  <div class="sticky-footer fixed bottom-0 left-0 right-0 px-4 py-3 fade-up-3">
    <div class="max-w-md mx-auto">
      <a id="wa-link" href="#" target="_blank" rel="noopener noreferrer"
         class="wa-btn flex items-center justify-center gap-2.5 w-full py-3.5 px-6 text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
        </svg>
        Order via WhatsApp
      </a>
    </div>
  </div>

  <!-- ── RENDERER ─────────────────────────────────────────── -->
  <script>
    const BADGE_CLASSES = {
      new:     'badge badge-new',
      popular: 'badge badge-popular',
      spicy:   'badge badge-spicy',
      veg:     'badge badge-veg',
    };

    function badgeHTML(badge) {
      if (!badge || !BADGE_CLASSES[badge]) return '';
      return `<span class="${BADGE_CLASSES[badge]}">${badge}</span>`;
    }

    function imageHTML(imagePath) {
      if (!imagePath) {
        // Placeholder fork icon when no image supplied
        return `<div class="food-img-placeholder">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8C4BC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
          </svg>
        </div>`;
      }
      return `<img src="${imagePath}" alt="" class="food-img" loading="lazy"
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
              <div class="food-img-placeholder" style="display:none">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8C4BC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
                </svg>
              </div>`;
    }

    function itemHTML(item) {
      const currency = '$'; // ← change currency symbol here if needed
      return `
        <div class="menu-card rounded-2xl p-4 mb-2 cursor-default">
          <div class="flex items-center gap-3">
            ${imageHTML(item.image)}
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <h3 class="font-semibold text-stone-800 text-[15px]">${item.name}</h3>
                ${badgeHTML(item.badge)}
              </div>
              <p class="mt-1 text-sm text-stone-400 font-light leading-snug">${item.description}</p>
            </div>
            <span class="text-stone-700 font-medium text-sm whitespace-nowrap self-start pt-0.5">
              ${currency}${item.price}
            </span>
          </div>
        </div>`;
    }

    function categoryHTML(cat) {
      const items = cat.items.map(itemHTML).join('');
      return `
        <section class="mb-8">
          <div class="mb-4 px-2">
            <span class="category-label">${cat.label}</span>
            <div class="mt-2 h-px bg-stone-200"></div>
          </div>
          ${items}
        </section>`;
    }

    async function loadMenu() {
      try {
        const res = await fetch('menu.json');
        if (!res.ok) throw new Error('fetch failed');
        const data = await res.json();

        const r = data.restaurant;

        // Populate header
        document.title = r.name + ' — Menu';
        document.getElementById('restaurant-name').textContent    = r.name;
        document.getElementById('restaurant-subtitle').textContent = r.subtitle;
        document.getElementById('restaurant-hours').textContent   = r.hours;
        document.getElementById('restaurant-timing').textContent  = r.timing;

        // WhatsApp link
        const waMsg = encodeURIComponent(r.whatsapp_message);
        document.getElementById('wa-link').href =
          `https://wa.me/${r.whatsapp}?text=${waMsg}`;

        // Render menu
        document.getElementById('menu-root').innerHTML =
          data.categories.map(categoryHTML).join('');

      } catch (e) {
        document.getElementById('error-msg').style.display = 'block';
        console.error('Menu load error:', e);
      }
    }

    loadMenu();
  </script>

</body>
</html>
